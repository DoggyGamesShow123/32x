<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Genesis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
  }

  #game {
    width: 100vw;
    height: 100vh;
  }

  #container {
    display: none;
  }

  input[type=file] {
    display: none;
  }

  .pleasewait {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lds-spinner {
    width: 64px;
    height: 64px;
    position: relative;
  }

  .lds-spinner div {
    transform-origin: 32px 32px;
    animation: spin 1.2s linear infinite;
  }

  .lds-spinner div:after {
    content: " ";
    position: absolute;
    top: 3px;
    left: 29px;
    width: 5px;
    height: 14px;
    background: #fff;
    border-radius: 20%;
  }

  @keyframes spin {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>

<body>
  <div id="game"></div>

  <div class="pleasewait" id="loading">
    <div class="lds-spinner">
      <div></div><div></div><div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div><div></div><div></div>
    </div>
  </div>

  <div id="container">
    <button id="demo-loader">START DEMO</button>
    <button id="file-selector">LOAD ROM</button>
    <input type="file" id="romfile-input" accept=".32x,.bin,.md">
  </div>

  Genesis.min.js>
  <script>
    var container = document.getElementById("container");
    var demoLoader = document.getElementById("demo-loader");
    var fileSelector = document.getElementById("file-selector");
    var romFileInput = document.getElementById("romfile-input");
    var loading = document.getElementById("loading");

    function isMobileDevice() {
      return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    }

    window.addEventListener("load", function () {
      container.style.display = "block";

      var params = new URLSearchParams(window.location.search);
      var demoRequired = params.has("demo");

      if (demoRequired) {
        demoLoader.style.display = "block";
      } else {
        fileSelector.style.display = "block";
      }

      demoLoader.addEventListener("click", function () {
        container.style.display = "none";

        var gameURL =
          "https://github.com/DoggyGamesShow123/32x/raw/refs/heads/main/knuckles.32x";

        var xhr = new XMLHttpRequest();
        xhr.open("GET", gameURL, true);
        xhr.responseType = "arraybuffer";

        xhr.onload = function () {
          if (xhr.status === 200) {
            embedGenesis({
              container: "game",
              name: "Knuckles Chaotix (32X)",
              rom: xhr.response,
              soundEnabled: true,
              showMobileControls: isMobileDevice(),
              cbStarted: function () {
                loading.style.display = "none";
              }
            });
          } else {
            loading.textContent = "Failed to load ROM.";
          }
        };

        xhr.onerror = function () {
          loading.textContent = "Network error.";
        };

        xhr.send();
      });

      fileSelector.addEventListener("click", function () {
        romFileInput.click();
      });

      romFileInput.addEventListener("change", function (e) {
        var file = e.target.files[0];
        if (!file) return;

        container.style.display = "none";

        var reader = new FileReader();
        reader.onload = function () {
          embedGenesis({
            container: "game",
            name: file.name,
            rom: reader.result,
            soundEnabled: true,
            showMobileControls: isMobileDevice(),
            cbStarted: function () {
              loading.style.display = "none";
            }
          });
        };

        reader.readAsArrayBuffer(file);
      });
    });
  </script>
</body>
</html>
