<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Genesis</title>

    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

    <style>
      *{scrollbar-width:none;-ms-overflow-style:none}
      *::-webkit-scrollbar{display:none}

      html,body{
        padding:0;
        margin:0;
        overscroll-behavior:none;
        background-color:#000;
        touch-action:none;
        user-select:none;
        -webkit-user-select:none;
        -webkit-tap-highlight-color:transparent
      }

      #container{display:none}
      input[type=file]{display:none}

      #demo-loader,#file-selector{
        position:fixed;
        inset:0;
        width:20vw;
        height:20vw;
        margin:auto;
        cursor:pointer;
        background:transparent;
        border:0;
        outline:0
      }

      #demo-loader:hover,#file-selector:hover{
        filter:brightness(110%)
      }

      #game{width:100vw;height:100vh}

      .pleasewait{
        position:fixed;
        width:64px;
        height:64px;
        inset:0;
        margin:auto
      }

      .lds-spinner{
        color:#fff;
        display:inline-block;
        position:relative;
        width:64px;
        height:64px
      }

      .lds-spinner div{
        transform-origin:32px 32px;
        animation:lds-spinner 1.2s linear infinite
      }

      .lds-spinner div:after{
        content:" ";
        display:block;
        position:absolute;
        top:3px;
        left:29px;
        width:5px;
        height:14px;
        border-radius:20%;
        background:#fff
      }

      @keyframes lds-spinner{
        0%{opacity:1}
        100%{opacity:0}
      }
    </style>
  </head>

  <body>
    <div id="game"></div>

    <div class="pleasewait" id="pleaseWait">
      <div class="lds-spinner">
        <div></div><div></div><div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div><div></div><div></div>
      </div>
    </div>

    <div id="container">
      <button id="demo-loader"></button>
      <button id="file-selector"></button>
      <input type="file" id="romfile-input"
        accept=".32x,.bin,.md,application/octet-stream">
    </div>

    <!-- ✅ ORIGINAL SCRIPT LOAD (FIXED) -->
    <script src="Genesis.min.js"></script>

    <script>
      var container = document.getElementById("container")
      var demoLoader = document.getElementById("demo-loader")
      var fileSelector = document.getElementById("file-selector")
      var romFileInput = document.getElementById("romfile-input")
      var pleaseWait = document.getElementById("pleaseWait")

      function isMobileDevice(){
        return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
      }

      window.addEventListener("load", function () {
        container.style.display = "block"
        pleaseWait.style.display = "none"

        var params = new URLSearchParams(location.search)
        var demoRequired = params.has("demo")

        if (demoRequired) {
          demoLoader.style.display = "block"

          // ✅ AUTO‑START DEMO (ORIGINAL BUG FIX)
          setTimeout(function(){
            demoLoader.click()
          }, 0)

        } else {
          fileSelector.style.display = "block"
        }

        demoLoader.addEventListener("click", function () {
          container.style.display = "none"
          pleaseWait.style.display = "block"

          // ✅ DEMO ROM REPLACED
          var gameURL =
            "https://github.com/DoggyGamesShow123/32x/raw/refs/heads/main/knuckles.32x"

          var xhr = new XMLHttpRequest()
          xhr.open("GET", gameURL, true)
          xhr.responseType = "arraybuffer"

          xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
              embedGenesis({
                container: "game",
                name: gameURL,
                rom: xhr.response,
                soundEnabled: true,
                showMobileControls: isMobileDevice(),
                cbStarted: function () {
                  pleaseWait.style.display = "none"
                }
              })
            }
          }

          xhr.send(null)
        })

        fileSelector.addEventListener("click", function () {
          romFileInput.click()
        })

        romFileInput.addEventListener("change", function (e) {
          var file = e.target.files[0]
          if (!file) return

          container.style.display = "none"
          pleaseWait.style.display = "block"

          var reader = new FileReader()
          reader.onload = function () {
            embedGenesis({
              container: "game",
              name: file.name,
              rom: reader.result,
              soundEnabled: true,
              showMobileControls: isMobileDevice(),
              cbStarted: function () {
                pleaseWait.style.display = "none"
              }
            })
          }

          reader.readAsArrayBuffer(file)
        })
      })
    </script>
  </body>
</html>
``
