<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Genesis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
#game { width: 100vw; height: 100vh; }
#loader {
  position: fixed; width: 64px; height: 64px;
  left: 0; right: 0; top: 0; bottom: 0; margin: auto;
}
#upload-box {
  position: fixed; left: 0; right: 0; top: 0; bottom: 0;
  margin: auto; width: 200px; height: 200px;
  display: none; cursor: pointer;
}
/* Overlay shown when a gamepad is detected but audio needs unlocking */
#gp-audio-prompt {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  color: #fff; font: bold 20px sans-serif;
  justify-content: center; align-items: center;
  text-align: center; z-index: 9999;
  cursor: pointer;
}
#gp-audio-prompt span { pointer-events: none; }
#gamepad-status {
  position: fixed; bottom: 8px; left: 8px;
  color: #fff; font: 12px monospace;
  opacity: 0; transition: opacity 1s;
  pointer-events: none; z-index: 9998;
}
input[type=file] { display: none; }
</style>
</head>
<body>

<div id="game"></div>

<div id="loader">
  <svg width="64" height="64" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="40" stroke="#fff" stroke-width="10" fill="none"
      stroke-dasharray="200" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" dur="1s"
        repeatCount="indefinite" from="0 50 50" to="360 50 50"/>
    </circle>
  </svg>
</div>

<button id="upload-box">
  <svg width="100%" height="100%" viewBox="0 0 502 502">
    <circle fill="#FFF" cx="250" cy="250" r="200"/>
    <path fill="#b9180b"
      d="M251,1C112.929,1,1,112.929,1,251s111.929,250,250,250s250-111.929,250-250S389.071,1,251,1z
      M251.283,111.853L351,236.738h-56.935v73.761H208.51v-73.761h-56.941L251.283,111.853z
      M208.51,336.122v-19.418h85.556v19.418H208.51z
      M294.065,341.665v10.186H208.51v-10.186H294.065z
      M391,380.147c0,5.522-4.477,10-10,10H121c-5.523,0-10-4.478-10-10
      v-72.935c0-5.743,4.643-10.399,10.37-10.399s10.37,4.656,10.37,10.399v62.194h238.52v-62.194
      c0-5.743,4.643-10.399,10.37-10.399S391,301.47,391,307.213V380.147z"/>
  </svg>
</button>

<input type="file" id="romfile" accept=".32x,.bin,.md">

<!-- Shown when gamepad connects before the user has clicked anything -->
<div id="gp-audio-prompt">
  <span>🎮 Controller connected!<br><br>Click or tap here to<br>enable audio &amp; start playing</span>
</div>

<div id="gamepad-status"></div>

<script src="Genesis.min.js"></script>
<script>
var loader       = document.getElementById("loader");
var uploadBox    = document.getElementById("upload-box");
var romInput     = document.getElementById("romfile");
var gpStatus     = document.getElementById("gamepad-status");
var audioPrompt  = document.getElementById("gp-audio-prompt");
var gpFadeTimer  = null;

// Track whether the user has already performed a gesture (unlocks AudioContext)
var audioUnlocked = false;
// Track whether the gamepad poll loop is running
var pollRunning = false;

function showGamepadMsg(msg) {
  gpStatus.textContent = msg;
  gpStatus.style.opacity = "1";
  clearTimeout(gpFadeTimer);
  gpFadeTimer = setTimeout(function() { gpStatus.style.opacity = "0"; }, 3000);
}

function isMobile() {
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

// ── Default key bindings ──────────────────────────────────────────────────
var DEFAULT_PLAYER1 = {
  up: "ArrowUp", down: "ArrowDown", left: "ArrowLeft", right: "ArrowRight",
  start: "Enter", mode: "KeyZ",
  a: "KeyA", b: "KeyS", c: "KeyD",
  x: "KeyQ", y: "KeyW", z: "KeyE"
};
var DEFAULT_PLAYER2 = {
  up: "KeyI", down: "KeyK", left: "KeyJ", right: "KeyL",
  start: "KeyH", mode: "KeyV",
  a: "KeyB", b: "KeyN", c: "KeyM",
  x: "KeyU", y: "KeyO", z: "KeyP"
};

// Standard Gamepad button index → Genesis action
var BUTTON_MAP = [
  "b",     // 0  Cross / A
  "c",     // 1  Circle / B
  "a",     // 2  Square / X
  "x",     // 3  Triangle / Y
  "y",     // 4  L1 / LB
  "z",     // 5  R1 / RB
  "mode",  // 6  L2 / LT
  "mode",  // 7  R2 / RT
  "mode",  // 8  Select / Back
  "start", // 9  Start
  null,    // 10 L3
  null,    // 11 R3
  "up",    // 12 D-pad up
  "down",  // 13 D-pad down
  "left",  // 14 D-pad left
  "right"  // 15 D-pad right
];

var gpPressed = [{}, {}];

function fireKey(code, down) {
  var evt = new KeyboardEvent(down ? "keydown" : "keyup", {
    bubbles: true, cancelable: true, code: code, key: code
  });
  document.dispatchEvent(evt);
}

function pollGamepads() {
  var gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
  var playerKeys = [DEFAULT_PLAYER1, DEFAULT_PLAYER2];
  var DEAD = 0.4;

  for (var gp = 0; gp < Math.min(gamepads.length, 2); gp++) {
    var pad = gamepads[gp];
    if (!pad || !pad.connected) continue;

    var keys = playerKeys[gp];

    // Buttons
    for (var b = 0; b < pad.buttons.length; b++) {
      var action = BUTTON_MAP[b];
      if (!action || !keys[action]) continue;
      var isDown = pad.buttons[b].pressed;
      if (isDown !== gpPressed[gp][b]) {
        gpPressed[gp][b] = isDown;
        fireKey(keys[action], isDown);
      }
    }

    // Left analogue stick
    var ax = pad.axes[0] || 0;
    var ay = pad.axes[1] || 0;

    var wantLeft  = ax < -DEAD;
    var wantRight = ax >  DEAD;
    var wantUp    = ay < -DEAD;
    var wantDown  = ay >  DEAD;

    if (wantLeft  !== !!gpPressed[gp]["axis_left"])  { gpPressed[gp]["axis_left"]  = wantLeft;  fireKey(keys["left"],  wantLeft);  }
    if (wantRight !== !!gpPressed[gp]["axis_right"]) { gpPressed[gp]["axis_right"] = wantRight; fireKey(keys["right"], wantRight); }
    if (wantUp    !== !!gpPressed[gp]["axis_up"])    { gpPressed[gp]["axis_up"]    = wantUp;    fireKey(keys["up"],    wantUp);    }
    if (wantDown  !== !!gpPressed[gp]["axis_down"])  { gpPressed[gp]["axis_down"]  = wantDown;  fireKey(keys["down"],  wantDown);  }
  }

  requestAnimationFrame(pollGamepads);
}

function startPollingIfNeeded() {
  if (!pollRunning) {
    pollRunning = true;
    requestAnimationFrame(pollGamepads);
  }
}

// ── Audio unlock helper ───────────────────────────────────────────────────
// Called on any real user gesture so the browser allows AudioContext to run.
function markAudioUnlocked() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  audioPrompt.style.display = "none";
  // Try to resume any suspended AudioContext the emulator may have created
  try {
    var ctxNames = ["AudioContext", "webkitAudioContext"];
    for (var i = 0; i < ctxNames.length; i++) {
      if (window[ctxNames[i]]) {
        // Monkey-patch constructor so future contexts auto-resume too
        var Original = window[ctxNames[i]];
        window[ctxNames[i]] = function() {
          var ctx = new Original();
          if (ctx.state === "suspended") { ctx.resume(); }
          return ctx;
        };
        break;
      }
    }
  } catch(e) {}
  startPollingIfNeeded();
}

// Any click/tap/keypress on the page counts as unlocking audio
document.addEventListener("click",    markAudioUnlocked, { once: true });
document.addEventListener("touchend", markAudioUnlocked, { once: true });
document.addEventListener("keydown",  markAudioUnlocked, { once: true });

// The prompt overlay itself is also a click target
audioPrompt.addEventListener("click", function() {
  markAudioUnlocked();
});

// ── Gamepad connect / disconnect ──────────────────────────────────────────
window.addEventListener("gamepadconnected", function(e) {
  showGamepadMsg("🎮 Controller " + (e.gamepad.index + 1) + " connected: " + e.gamepad.id);
  if (!audioUnlocked) {
    // Show the prompt so the user performs a gesture to unlock audio
    audioPrompt.style.display = "flex";
  } else {
    startPollingIfNeeded();
  }
});

window.addEventListener("gamepaddisconnected", function(e) {
  showGamepadMsg("🎮 Controller " + (e.gamepad.index + 1) + " disconnected");
  gpPressed[e.gamepad.index] = {};
  if (audioPrompt.style.display === "flex") {
    audioPrompt.style.display = "none";
  }
});

// ── ROM loading ───────────────────────────────────────────────────────────
function startROM(name, data) {
  embedGenesis({
    container: "game",
    name: name,
    rom: data,
    soundEnabled: true,
    showMobileControls: isMobile(),
    player1: DEFAULT_PLAYER1,
    player2: DEFAULT_PLAYER2,
    cbStarted: function() { loader.style.display = "none"; }
  });
}

function loadDemoROM() {
  var url = "https://raw.githubusercontent.com/DoggyGamesShow123/32x/main/knuckles.32x";
  fetch(url)
    .then(function(r) { return r.arrayBuffer(); })
    .then(function(buf) { startROM("Demo", buf); });
}

function enableUploadMode() {
  uploadBox.style.display = "block";
  uploadBox.onclick = function() { romInput.click(); };
  romInput.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function() { startROM(file.name, reader.result); };
    reader.readAsArrayBuffer(file);
  };
}

window.onload = function() {
  var params = new URLSearchParams(location.search);
  if (params.has("demo")) {
    loadDemoROM();
  } else {
    enableUploadMode();
  }
};
</script>
</body>
</html>
