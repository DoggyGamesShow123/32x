<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Genesis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
  }
  #game {
    width: 100vw;
    height: 100vh;
  }
  #loader {
    position: fixed;
    width: 64px;
    height: 64px;
    left: 0; right: 0; top: 0; bottom: 0;
    margin: auto;
  }
  #upload-box {
    position: fixed;
    left: 0; right: 0; top: 0; bottom: 0;
    margin: auto;
    width: 200px;
    height: 200px;
    display: none;
    cursor: pointer;
  }
  input[type=file] { display: none; }
</style>
</head>

<body>

<div id="game"></div>

<div id="loader">
  <svg width="64" height="64" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="40" stroke="#fff" stroke-width="10" fill="none" stroke-dasharray="200" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" dur="1s" repeatCount="indefinite" from="0 50 50" to="360 50 50"/>
    </circle>
  </svg>
</div>

<button id="upload-box">
  <svg width="100%" height="100%" viewBox="0 0 502 502">
    <circle fill="#FFF" cx="250" cy="250" r="200" />
    <path fill="#b9180b"
      d="M251,1C112.929,1,1,112.929,1,251s111.929,250,250,250s250-111.929,250-250S389.071,1,251,1z
         M251.283,111.853L351,236.738h-56.935v73.761H208.51v-73.761h-56.941L251.283,111.853z
         M208.51,336.122v-19.418h85.556v19.418H208.51z
         M294.065,341.665v10.186H208.51v-10.186H294.065z
         M391,380.147c0,5.522-4.477,10-10,10H121c-5.523,0-10-4.478-10-10
         v-72.935c0-5.743,4.643-10.399,10.37-10.399s10.37,4.656,10.37,10.399v62.194h238.52v-62.194
         c0-5.743,4.643-10.399,10.37-10.399S391,301.47,391,307.213V380.147z" />
  </svg>
</button>

<input type="file" id="romfile" accept=".32x,.bin,.md">

<script src="Genesis.min.js"></script>

<script>
const loader = document.getElementById("loader");
const uploadBox = document.getElementById("upload-box");
const romInput = document.getElementById("romfile");

function isMobile() {
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function startROM(name, data) {
  embedGenesis({
    container: "game",
    name: name,
    rom: data,
    soundEnabled: true,
    showMobileControls: isMobile(),
    cbStarted: () => loader.style.display = "none"
  });
}

function loadDemoROM() {
  const url = "https://raw.githubusercontent.com/DoggyGamesShow123/32x/main/knuckles.32x";

  fetch(url)
    .then(r => r.arrayBuffer())
    .then(buf => startROM("Demo", buf));
}

function enableUploadMode() {
  uploadBox.style.display = "block";

  uploadBox.onclick = () => romInput.click();

  romInput.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => startROM(file.name, reader.result);
    reader.readAsArrayBuffer(file);
  };
}

window.onload = () => {
  const params = new URLSearchParams(location.search);

  if (params.has("demo")) {
    loadDemoROM();      // auto‑run demo
  } else {
    enableUploadMode(); // allow ROM upload
  }
};
</script>

</body>
</html>
